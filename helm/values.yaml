# Default values for the MySql8 deployment

mysql:
  image:
    repository: localhost:5000/mysql
    version: 8.4.0
    pullPolicy: Always
  serviceUrl: mysql-service
  database: SPRING
  user: tmuser

  service:
    type: ClusterIP
    port: 3306

  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 0.5
      memory: 1Gi

  livenessProbe:
    tcpSocket:
      port: mysql
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: mysql
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 5
  startupProbe:
    tcpSocket:
      port: mysql
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 10

  volumeMounts:
  - name: mysql8-persistent-storage
    mountPath: /var/lib/mysql

  volumes:
  - name: mysql8-persistent-storage
    persistentVolumeClaim:
      claimName: pvc-rest-controller-mysql


# Default values for the deployment
spring:
  profilesActive: rke
  datasourceUrl: "jdbc:mysql://mysql-service.rest.svc.cluster.local:3306/SPRING?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
  jpaDDLAuto: update

image:
  repository: localhost:5000/basic-rest-controller
  version: 1.0.6
  pullPolicy: Always

podLabels: []

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 9999
  runAsGroup: 9999

service:
  type: ClusterIP
  port: 8888
  debugPort: 5005

ingress:
  host: basic-rest-controller.local
  issuerName: basic-rest-controller-ingress
  tlsSecret: basic-rest-controller-tls-data

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

volumeMounts:
- name: tmp
  mountPath: /tmp

volumes:
- name: tmp
  emptyDir: {}
