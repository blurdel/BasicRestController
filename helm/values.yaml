# Default values for mysql8
global:
  appPort: &appPort 8888
  mysqlPort: &mysqlPort 3306

replicas: 1
image:
  repository: localhost:5000/basic-rest-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

ingress:
  host: basic-rest-controller.local

service:
  type: ClusterIP
  port: *appPort
  targetPort: *appPort

livenessProbe:
  httpget:
    path: /healthz
    port: *appPort
  initialDelaySeconds: 30
  periodSeconds: 20
  failureThreshold: 7
readinessProbe:
  httpget:
    path: /healthz
    port: *appPort
  initialDelaySeconds: 30
  periodSeconds: 20
  failureThreshold: 7

# MySQL Deployment
mysql:
  image:
    repository: mysql
    version: 8.4.0
    pullPolicy: IfNotPresent
    tag: ""
  serviceUrl: mysql-service
  rootPassword: c2VjcmV0
  database: PEOPLE
  user: dG11c2Vy
  password: dG11c2Vy

  service:
    type: ClusterIP
    port: *mysqlPort

  resources:
    limits:
      cpu: 0.5
      memory: 1Gi
    requests:
      cpu: 0.5
      memory: 1Gi

  livenessProbe:
    tcpSocket:
      port: *mysqlPort
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 5
  readinessProbe:
    tcpSocket:
      port: *mysqlPort
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 5
